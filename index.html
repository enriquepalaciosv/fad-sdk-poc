<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.css">
  <link rel="stylesheet" href="/ui-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.js"></script>
  <title>Identity Validator JS</title>
</head>

<body>
  <div class="surface config-form">
    <md-elevation></md-elevation>
    <div class="row responsive">
      <md-outlined-select label="Environment">
        <md-select-option value="test">
          <div slot="headline">test</div>
        </md-select-option>
        <md-select-option selected value="production">
          <div slot="headline">production</div>
        </md-select-option>
      </md-outlined-select>
      <label class="toggler">
        Debug
        <md-switch selected></md-switch>
      </label>
    </div>

    <div class="responsive row">
      <md-outlined-text-field label="API URL"></md-outlined-text-field>
    </div>
    <div class="row right">
      <md-filled-button id="selfie-verification-button">Selfie Verification</md-filled-button>
      <md-outlined-button id="capture-id-button">Capture ID</md-outlined-button>
    </div>
  </div>


  <div id="jsoneditor" class="result"></div>

  <script type="module" src="%SCRIPT_SRC%"></script>
  <script>
    function customizeSubmitButtons(btnId, innerBtnId) {
      document.getElementById(btnId).addEventListener('click', function (event) {
        const injectedBtn = this.querySelector(`#${innerBtnId}`);
        if (injectedBtn && event.target === this) {
          injectedBtn.click();
        }
      });
      const injectedBtn = document.querySelector(`#${innerBtnId}`);
      if (injectedBtn) {
        injectedBtn.style.backgroundColor = 'transparent';
        injectedBtn.style.color = 'transparent';
        injectedBtn.style.border = 'none';
        injectedBtn.style.width = '0px';
        injectedBtn.style.height = '0px';
      }
    }
  </script>
  <script>
    if (typeof window !== 'undefined') {

      const renderResult = (result) => {
        const container = document.getElementById("jsoneditor");
        container.innerHTML = "";
        const options = { mode: "view" };
        const editor = new JSONEditor(container, options);
        editor.set(result);
      }

      window.addEventListener('DOMContentLoaded', () => {
        const validator = new IdentityValidator({
          fadAppName: 'rac',
          fadToken: 'WVFDSTdGclFBWEt4TytScXpNS1NtdGZtMnhBQU1FWEdkSzMrNFpMMmFVaHR2Mk4xYTVhdmQxS0cvTm5BV2VUbzBVemdOMEQ4UVhyRjV1elFsMFJEaFNXWTBjWTRBSStrMG5IZDQzUjZRZEtVMFBkaWJkOXFQZFBsYUdsbmQram0=',
          captureIdContainerId: 'capture-id-button',
          selfieVerificationContainerId: 'selfie-verification-button',
          api_url: 'http://localhost:3017',
          business_unit: 'acima',
          customer_guid: 'cust-0892b27c-52ef-4619-8222-e499d1405c01',
          transaction_guid: 'txn-some-value-returned-by-caputre-id-flow',
          onCaptureIdComplete: function (result) {
            renderResult(result);
          },
          onSelfieVerificationComplete: function (result) {
            renderResult(result);
          },
        });
        validator.renderCaptureId();
        validator.renderSelfieVerification();

        // Two lines below are not needed, they are just for UI customization
        customizeSubmitButtons('capture-id-button', 'idvjs-capture-id-btn');
        customizeSubmitButtons('selfie-verification-button', 'idvjs-selfie-btn');
      });
    }
  </script>

</body>

</html>
